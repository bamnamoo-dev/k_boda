[package]
name = "k-boda"
version = "1.0.0"
description = "PrismView - 윈도우용 빠르고 가벼운 이미지 뷰어"
authors = ["bamnamoo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kboda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: convertFileSrc(asset 프로토콜)로 로컬 이미지를 표시하기 위해 필요
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
tiff = "0.11"
kamadak-exif = "0.6"
trash = "5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
notify = "8.2.0"
tauri-plugin-drag = "2.1.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry"] }
base64 = "0.22"
pdf-writer = "0.15"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
